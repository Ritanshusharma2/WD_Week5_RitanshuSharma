<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER / NAVIGATION ===== -->
    <header class="header">
        <div class="header-brand">
            <span class="logo">&#9745;</span>
            <h1>TaskMaster</h1>
        </div>
        <nav class="header-nav">
            <span class="nav-link active" data-view="all">All Tasks</span>
            <span class="nav-link" data-view="active">Active</span>
            <span class="nav-link" data-view="completed">Completed</span>
        </nav>
        <div class="header-stats">
            <div class="stat">
                <span class="stat-count" id="totalCount">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat">
                <span class="stat-count" id="activeCount">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat">
                <span class="stat-count" id="completedCount">0</span>
                <span class="stat-label">Done</span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

        <!-- Left Panel — Add / Edit Task Form -->
        <aside class="panel panel-form">
            <h2 class="panel-title" id="formTitle">Add New Task</h2>

            <form id="taskForm" novalidate>
                <!-- Task Title -->
                <div class="form-group">
                    <label for="taskTitle">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="e.g. Complete assignment" maxlength="80" required>
                    <span class="error-msg" id="titleError"></span>
                </div>

                <!-- Task Description -->
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" rows="3" placeholder="Add details…" maxlength="250"></textarea>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="taskCategory">Category <span class="required">*</span></label>
                    <select id="taskCategory" required>
                        <option value="">— Select —</option>
                        <option value="work">💼 Work</option>
                        <option value="personal">🏠 Personal</option>
                        <option value="shopping">🛒 Shopping</option>
                        <option value="health">💪 Health</option>
                        <option value="education">📚 Education</option>
                    </select>
                    <span class="error-msg" id="categoryError"></span>
                </div>

                <!-- Priority -->
                <div class="form-group">
                    <label>Priority <span class="required">*</span></label>
                    <div class="priority-group">
                        <label class="priority-option">
                            <input type="radio" name="taskPriority" value="high">
                            <span class="priority-badge high">High</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="taskPriority" value="medium" checked>
                            <span class="priority-badge medium">Medium</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="taskPriority" value="low">
                            <span class="priority-badge low">Low</span>
                        </label>
                    </div>
                </div>

                <!-- Due Date -->
                <div class="form-group">
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate">
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Task</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
                </div>
            </form>
        </aside>

        <!-- Right Panel — Task List -->
        <section class="panel panel-tasks">

            <!-- Toolbar: Search, Filter, Sort -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search tasks…">
                </div>
                <select id="filterCategory" class="toolbar-select">
                    <option value="all">All Categories</option>
                    <option value="work">💼 Work</option>
                    <option value="personal">🏠 Personal</option>
                    <option value="shopping">🛒 Shopping</option>
                    <option value="health">💪 Health</option>
                    <option value="education">📚 Education</option>
                </select>
                <select id="sortBy" class="toolbar-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="priority">Priority ↑</option>
                    <option value="name">Name A–Z</option>
                    <option value="dueDate">Due Date</option>
                </select>
                <button class="btn btn-danger" id="clearCompletedBtn">Clear Completed</button>
            </div>

            <!-- Task Cards Container -->
            <div id="taskList" class="task-list">
                <!-- Task cards rendered dynamically by JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <p class="empty-icon">📋</p>
                <p>No tasks yet — add one using the form!</p>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>&copy; 2026 TaskMaster — Built with HTML, CSS &amp; JavaScript</p>
    </footer>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <p id="confirmMessage">Are you sure?</p>
            <div class="modal-actions">
                <button class="btn btn-danger" id="confirmYes">Yes, Delete</button>
                <button class="btn btn-secondary" id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
